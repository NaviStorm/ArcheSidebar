<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body {
            width: 200px;
            padding: 16px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-size: 14px;
            margin: 0;
        }
        .popup-title {
            font-weight: 600;
            margin-bottom: 12px;
            color: #333;
        }
        .popup-section {
            margin-bottom: 16px;
        }
        .popup-button {
            width: 100%;
            padding: 8px 12px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            margin-bottom: 8px;
        }
        .popup-button:hover { background: #0056b3; }
        .popup-button.secondary { background: #6c757d; }
        .popup-button.secondary:hover { background: #545b62; }
        .status {
            font-size: 12px;
            padding: 6px;
            border-radius: 3px;
            text-align: center;
            margin-bottom: 12px;
        }
        .status.active {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .status.inactive {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>
    <div class="popup-title">NewArche</div>
    
    <div id="status" class="status inactive">
        Volet fermé
    </div>
    
    <div class="popup-section">
        <button id="toggle-sidebar" class="popup-button">
            Ouvrir le volet
        </button>
    </div>
    
    <!-- La section pour la position a été retirée car elle n'est plus applicable -->
    
    <div class="popup-section">
        <button id="reset-settings" class="popup-button secondary">
            Réinitialiser (Ferme le volet)
        </button>
    </div>

    <script src="popup.js"></script>
</body>
</html>
